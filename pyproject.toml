[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amarr"
version = "0.0.0"  # Managed by the automatic release (see release.yml).
description = "Connector that lets you use aMule as a download client for Sonarr/Radarr (Python port)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "amarr (Python port)" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient
]

[project.scripts]
amarr = "amarr.app:main"

[tool.setuptools.packages.find]
include = ["amarr*"]

[tool.setuptools.package-data]
# nodes.dat bundled for the Kad search engine.
"amarr.ed2k" = ["data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
