name: Release
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write  # needed to publish to ghcr.io

jobs:
  # Tests must pass before publishing the image.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # On version tags, stamp the package version so the built image matches the
      # tag. The working tree is the Docker build context, so no commit is needed.
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${VER}\"/" pyproject.toml

      # Log in to GitHub Container Registry with the built-in token
      # (no additional secrets need to be configured).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags: 'latest' and sha on main; semver (1.2.3, 1.2, 1) on tags.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/amarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build and push for amd64 and arm64 (same as the original Jib config).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Only on version tags (v*.*.*): publish a GitHub Release with notes from
  # CHANGELOG.md and a source zip attached, in addition to the Docker image.
  github-release:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@v5

      # Stamp the version from the tag, then archive the tagged sources. The
      # version bump is a throwaway local commit (never pushed) so that
      # ``git archive`` includes it in a clean, deterministic zip.
      - name: Build source zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${VER}\"/" pyproject.toml
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -am "chore: set version ${VER} for release" >/dev/null
          git archive --format=zip \
            --prefix="amarr-${GITHUB_REF_NAME}/" \
            -o "amarr-${GITHUB_REF_NAME}-src.zip" HEAD

      # Pull the section for this tag out of CHANGELOG.md as the release notes.
      - name: Extract release notes
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            $0 ~ ("^## " ver "([ ]|$)") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > release_notes.md
          fi

      # Create the release with the notes and attach the source zip.
      # (GitHub also auto-attaches its own "Source code" archives.)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            "amarr-${GITHUB_REF_NAME}-src.zip"
