# Example deployment of amarr (Python port).
# The image is published on GitHub Container Registry (ghcr.io); replace
# <owner> with your GitHub user/organization.
services:
  amarr:
    image: ghcr.io/<owner>/amarr:latest
    container_name: amarr
    environment:
      - AMULE_HOST=aMule
      - AMULE_PORT=4712
      - AMULE_PASSWORD=secret
      # Optional:
      # - AMULE_FINISHED_PATH=/finished
      # - AMARR_PORT=8080
      # - AMARR_LOG_LEVEL=INFO
    volumes:
      - /path/to/amarr/config:/config
    ports:
      - 8080:8080
